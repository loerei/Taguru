<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Gradients -->
    <linearGradient id="tabWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="tabMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="tabDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Transparent Background (Maximized Scale Symbol) -->
  <g transform="translate(0, 0)">
    <!-- TIER 1: Background Layer Tab (Dark Slate Gray) -->
    <polygon points="30,30 360,30 440,110 570,110 570,390 30,390" fill="url(#tabDarkGrad)" />

    <!-- TIER 2: Middle Layer Tab (Mid Silver Gray) -->
    <polygon points="80,120 410,120 480,190 570,190 570,470 80,470" fill="url(#tabMidGrad)" />

    <!-- TIER 3: Foreground Primary Tab (Pure White Frame) -->
    <polygon points="130,210 460,210 520,270 570,270 570,560 130,560" fill="url(#tabWhiteGrad)" />
  </g>
</svg>